<!DOCTYPE html>
<html lang="ko" data-version="4">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>데일리 워크아웃</title>
  <!-- 홈 화면에 추가했을 때 앱처럼 보이게 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="워크아웃">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- ?v=숫자: 파일을 고칠 때마다 올림 (휴대폰 캐시 때문) -->
  <link rel="stylesheet" href="workout.css?v=4">
</head>
<body>
  <header>
    <h1>데일리 워크아웃</h1>
    <p id="wk-week-label" class="wk-sub"></p>
  </header>
  <div id="wk-update-banner" class="wk-update" hidden>
    <span>새 버전이 나왔어요.</span>
    <button type="button" id="wk-update-btn">업데이트</button>
  </div>

  <main>
    <!-- 1) 이번 주 계획이 없을 때: 며칠 할지 고르기 -->
    <section id="wk-setup" class="wk-card" hidden>
      <h2>이번 주 며칠 운동할까요?</h2>
      <div id="wk-day-buttons" class="wk-day-buttons"></div>
      <p id="wk-day-note" class="wk-note"></p>

      <h3>LSD(긴 러닝) 요일</h3>
      <div class="wk-seg" id="wk-lsd-seg">
        <button type="button" data-lsd="5">토요일</button>
        <button type="button" data-lsd="6">일요일</button>
      </div>

      <h3>미리 보기</h3>
      <ol id="wk-preview" class="wk-preview"></ol>

      <button type="button" id="wk-make" class="wk-primary">이번 주 프로그램 짜기</button>
    </section>

    <!-- 2) 계획이 있을 때: 요일 줄 + 선택한 날의 운동 -->
    <section id="wk-plan" hidden>
      <div class="wk-card wk-progress-card">
        <div class="wk-progress-top">
          <strong id="wk-phase-name"></strong>
          <span id="wk-progress-text"></span>
        </div>
        <div class="wk-bar"><div id="wk-bar-fill"></div></div>
        <p id="wk-phase-tip" class="wk-note"></p>
      </div>

      <div id="wk-strip" class="wk-strip"></div>
      <div id="wk-session"></div>

      <div class="wk-card">
        <h2>지난 기록</h2>
        <ul id="wk-history" class="wk-history"></ul>
        <button type="button" id="wk-reset" class="wk-ghost">이번 주 다시 짜기</button>
      </div>
    </section>

    <!-- 3) 월 달력: 이번 달부터 운동한 날 체크 (항상 보임) -->
    <section id="wk-cal" class="wk-card">
      <div class="wk-cal-head">
        <button type="button" id="wk-cal-prev" aria-label="이전 달">‹</button>
        <h2 id="wk-cal-title"></h2>
        <button type="button" id="wk-cal-next" aria-label="다음 달">›</button>
      </div>
      <div class="wk-cal-grid wk-cal-names"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
      <div id="wk-cal-grid" class="wk-cal-grid"></div>
      <p id="wk-cal-sum" class="wk-cal-sum"></p>
      <p class="wk-note">날짜를 누르면 "운동함" 체크 / 다시 누르면 취소. 계획에 없던 날도 체크할 수 있어요.</p>
    </section>
  </main>

  <!-- 동작 보기 창: 운동 이름(▶)을 누르면 열림, 막대 사람이 동작을 반복 -->
  <div id="wk-sheet" class="wk-sheet" hidden>
    <div class="wk-sheet-bg" data-sheet-close></div>
    <div class="wk-sheet-box" role="dialog" aria-modal="true" aria-labelledby="wk-sheet-title">
      <button type="button" class="wk-sheet-x" data-sheet-close aria-label="닫기">✕</button>
      <div id="wk-sheet-anim" class="wk-sheet-anim"></div>
      <p id="wk-sheet-hint" class="wk-sheet-hint" hidden>↔ 그림을 좌우로 밀면 돌려 볼 수 있어요</p>
      <div id="wk-sheet-muscles" class="wk-sheet-muscles"></div>
      <h2 id="wk-sheet-title"></h2>
      <p id="wk-sheet-reps" class="wk-ex-meta"></p>
      <ol id="wk-sheet-how" class="wk-sheet-how"></ol>
      <p id="wk-sheet-tip" class="wk-tip"></p>
      <div id="wk-sheet-eq"></div>
    </div>
  </div>

  <!-- 휴식 타이머 (운동 화면의 "휴식" 버튼으로 시작) -->
  <div id="wk-timer" class="wk-timer" hidden>
    <span id="wk-timer-text">01:00</span>
    <button type="button" id="wk-timer-plus">+30초</button>
    <button type="button" id="wk-timer-stop">끝</button>
  </div>

  <footer>
    <p>앱 버전 v4 · 기록은 이 기기에만 저장돼요</p>
  </footer>

  <script src="workout-data.js?v=4"></script>
  <script src="workout-motion.js?v=4"></script>
  <script src="workout-3d.js?v=4"></script>
  <script src="workout.js?v=4"></script>
</body>
</html>
